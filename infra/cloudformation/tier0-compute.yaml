AWSTemplateFormatVersion: '2010-09-09'
Description: Tier 0 Co-Story EC2 runtime with SSM and pinned Bedrock Guardrail access. Creates no SSH key or application secret.

Parameters:
  PublicAppSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public app subnet from co-story-tier0-network.
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: App security group from co-story-tier0-network.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    AllowedValues:
      - amazon.nova-lite-v1:0
  BedrockGuardrailId:
    Type: String
    AllowedPattern: '^[a-z0-9]+$'
  BedrockGuardrailVersion:
    Type: String
    Default: '1'
    AllowedPattern: '^[1-9][0-9]*$'

Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSFinalProjectAppRole
      Description: Co-Story Tier 0 EC2 role with SSM core only.
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CoStoryTier0BedrockRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowPinnedNovaLiteWithGuardrailV1
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                Condition:
                  StringEquals:
                    bedrock:GuardrailIdentifier:
                      Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}:${BedrockGuardrailVersion}
              - Sid: DenyNovaLiteWithoutGuardrailV1
                Effect: Deny
                Action: bedrock:InvokeModel
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                Condition:
                  StringNotEquals:
                    bedrock:GuardrailIdentifier:
                      Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}:${BedrockGuardrailVersion}
              - Sid: ApplyPinnedGuardrailAcrossApacProfile
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-south-1:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-3:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-2:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-southeast-1:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-southeast-2:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-1:${AWS::AccountId}:guardrail-profile/apac.guardrail.v1:0
      Tags:
        - Key: Project
          Value: co-story
        - Key: Tier
          Value: '0'

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: AWSFinalProjectAppInstanceProfile
      Roles:
        - Ref: AppRole

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: LatestAmiId
      InstanceType: t4g.micro
      IamInstanceProfile:
        Ref: AppInstanceProfile
      CreditSpecification:
        CPUCredits: standard
      Monitoring: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - Ref: AppSecurityGroupId
          SubnetId:
            Ref: PublicAppSubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: co-story-tier0-app
        - Key: Project
          Value: co-story
        - Key: Tier
          Value: '0'

Outputs:
  AppInstanceId:
    Value:
      Ref: AppInstance
  AppRoleName:
    Value:
      Ref: AppRole
  AppInstanceProfileName:
    Value:
      Ref: AppInstanceProfile
