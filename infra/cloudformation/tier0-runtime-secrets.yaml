AWSTemplateFormatVersion: '2010-09-09'
Description: Tier 0 Co-Story application database secret and bounded migration bootstrap access.

Parameters:
  AppRoleName:
    Type: String
    Default: AWSFinalProjectAppRole
    AllowedPattern: '^AWSFinalProject[A-Za-z0-9+=,.@_-]+$'
    Description: Existing EC2 application role created by co-story-tier0-compute.
  MasterSecretArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:ap-northeast-1:[0-9]{12}:secret:.+$'
    Description: RDS-managed master secret ARN from co-story-tier0-rds Outputs.
  EnableMigrationBootstrapAccess:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Temporarily lets the EC2 role read only the RDS master secret for database-user bootstrap.

Conditions:
  MigrationBootstrapAccessEnabled:
    Fn::Equals:
      - Ref: EnableMigrationBootstrapAccess
      - 'true'

Resources:
  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Co-Story Tier 0 restricted PostgreSQL application credential.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"co_story_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: co-story-tier0-app-db
        - Key: Project
          Value: co-story
        - Key: Tier
          Value: '0'

  AppDbSecretReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AWSFinalProjectAppDbSecretRead
      Description: Lets the Co-Story application instance read only its generated database secret.
      Roles:
        - Ref: AppRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadApplicationDatabaseSecret
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource:
              Ref: AppDbSecret

  MigrationBootstrapSecretReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: MigrationBootstrapAccessEnabled
    Properties:
      ManagedPolicyName: AWSFinalProjectMigrationBootstrapSecretRead
      Description: Temporary exact-secret access used only to create the restricted database user.
      Roles:
        - Ref: AppRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadRdsMasterSecretForMigrationBootstrap
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource:
              Ref: MasterSecretArn

Outputs:
  AppDbSecretArn:
    Value:
      Ref: AppDbSecret
  MigrationBootstrapAccess:
    Value:
      Ref: EnableMigrationBootstrapAccess
