AWSTemplateFormatVersion: '2010-09-09'
Description: Tier 1 Co-Story bounded application log group and single-instance write access.

Parameters:
  AppRoleName:
    Type: String
    Default: AWSFinalProjectAppRole
    AllowedPattern: '^AWSFinalProject[A-Za-z0-9+=,.@_-]+$'
    Description: Existing EC2 application role created by co-story-tier0-compute.
  AppInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Existing application instance created by co-story-tier0-compute.

Resources:
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /co-story/tier1/application
      LogGroupClass: STANDARD
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: co-story-tier1-application
        - Key: Project
          Value: co-story
        - Key: Tier
          Value: '1'

  Application5xxMetricFilter:
    Type: AWS::Logs::MetricFilter
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FilterName: co-story-tier1-application-5xx
      FilterPattern: '{ ($.status >= 500) && ($.status <= 599) }'
      LogGroupName:
        Ref: ApplicationLogGroup
      MetricTransformations:
        - DefaultValue: 0
          MetricName: Application5xx
          MetricNamespace: CoStory/Tier1
          MetricValue: '1'
          Unit: Count

  Application5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ActionsEnabled: false
      AlarmDescription: Co-Story application emitted at least one 5xx in one minute.
      AlarmName: co-story-tier1-application-5xx
      ComparisonOperator: GreaterThanOrEqualToThreshold
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      MetricName: Application5xx
      Namespace: CoStory/Tier1
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
      Unit: Count

  ApplicationLogWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AWSFinalProjectTier1ApplicationLogWrite
      Description: Lets the existing Co-Story instance write only its Tier 1 application log stream.
      Roles:
        - Ref: AppRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeApplicationLogStreams
            Effect: Allow
            Action: logs:DescribeLogStreams
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/co-story/tier1/application
          - Sid: WriteSingleInstanceApplicationLogStream
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/co-story/tier1/application:log-stream:${AppInstanceId}

Outputs:
  ApplicationLogGroupName:
    Value:
      Ref: ApplicationLogGroup
