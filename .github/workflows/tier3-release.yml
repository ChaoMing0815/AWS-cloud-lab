name: Tier 3 container release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Explicit first-transition or established-container release mode
        required: true
        type: choice
        options:
          - legacy-bootstrap
          - digest-release
          - migration-bridge
          - schema-activation
      previous_image_digest:
        description: Required for digest, bridge, and schema activation; must be the verified active digest
        required: false
        default: ""
        type: string
      expected_legacy_release:
        description: Required only for legacy-bootstrap
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: tier3-production-release
  cancel-in-progress: false

jobs:
  record-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      requested_epoch: ${{ steps.request.outputs.requested_epoch }}
    steps:
      - name: Record measurement start
        id: request
        run: echo "requested_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  approval-gate:
    if: github.ref == 'refs/heads/main'
    needs: record-request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      requested_epoch: ${{ needs.record-request.outputs.requested_epoch }}
      approved_epoch: ${{ steps.approval.outputs.approved_epoch }}
    steps:
      - name: Record bounded approval gate
        id: approval
        run: |
          test "${{ github.ref }}" = refs/heads/main
          echo "approved_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: approval-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Record automation start
        id: deploy_timing
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Check out approved source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Validate mutually exclusive release inputs
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          PREVIOUS_IMAGE_DIGEST: ${{ inputs.previous_image_digest }}
          EXPECTED_LEGACY_RELEASE: ${{ inputs.expected_legacy_release }}
        run: |
          case "$RELEASE_MODE" in
            legacy-bootstrap)
              if [[ -n "$PREVIOUS_IMAGE_DIGEST" ]]; then
                printf '%s\n' 'bootstrap must not provide a previous digest' >&2
                exit 2
              fi
              if [[ "$EXPECTED_LEGACY_RELEASE" != tier1-20260825-4a51e0e ]]; then
                printf '%s\n' 'bootstrap requires the exact expected legacy release' >&2
                exit 2
              fi
              ;;
            digest-release)
              if [[ ! "$PREVIOUS_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                printf '%s\n' 'digest release requires a previous digest' >&2
                exit 2
              fi
              if [[ -n "$EXPECTED_LEGACY_RELEASE" ]]; then
                printf '%s\n' 'digest release must not provide a legacy release' >&2
                exit 2
              fi
              ;;
            migration-bridge)
              if [[ ! "$PREVIOUS_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                printf '%s\n' 'bridge requires a previous digest' >&2
                exit 2
              fi
              if [[ -n "$EXPECTED_LEGACY_RELEASE" ]]; then
                printf '%s\n' 'bridge must not provide a legacy release' >&2
                exit 2
              fi
              ;;
            schema-activation)
              if [[ ! "$PREVIOUS_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                printf '%s\n' 'schema activation requires a previous digest' >&2
                exit 2
              fi
              if [[ -n "$EXPECTED_LEGACY_RELEASE" ]]; then
                printf '%s\n' 'schema activation must not provide a legacy release' >&2
                exit 2
              fi
              ;;
            *)
              printf '%s\n' 'invalid release mode' >&2
              exit 2
              ;;
          esac
      - name: Validate canonical deployment target
        env:
          UNVALIDATED_TIER3_INSTANCE_ID: ${{ vars.TIER3_INSTANCE_ID }}
        run: |
          if [[ ! "$UNVALIDATED_TIER3_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]; then
            printf '%s\n' 'instance target must be one canonical EC2 instance ID' >&2
            exit 2
          fi
          printf 'VALIDATED_TIER3_INSTANCE_ID=%s\n' \
            "$UNVALIDATED_TIER3_INSTANCE_ID" >> "$GITHUB_ENV"
      - name: Configure bounded AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ vars.TIER3_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to the bounded ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Build and push immutable commit image
        id: build
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: CO_STORY_SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.TIER3_ECR_REPOSITORY }}:${{ github.sha }}
      - name: Fence target and previous digests
        if: inputs.release_mode != 'legacy-bootstrap'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS_IMAGE_DIGEST: ${{ inputs.previous_image_digest }}
        run: |
          if [[ "$IMAGE_DIGEST" == "$PREVIOUS_IMAGE_DIGEST" ]]; then
            printf '%s\n' 'target and previous image digests must differ' >&2
            exit 2
          fi
      - name: Scan the exact pushed digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.70.0
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ vars.TIER3_ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Record verified artifact timing
        id: artifact_timing
        run: echo "artifact_ready_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Release exact digest through bounded SSM document
        id: release_timing
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS_IMAGE_DIGEST: ${{ inputs.previous_image_digest }}
          EXPECTED_LEGACY_RELEASE: ${{ inputs.expected_legacy_release }}
          REPOSITORY_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.TIER3_ECR_REPOSITORY }}
        run: |
          echo "release_started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          parameters="$(jq -cn \
            --arg repository_uri "$REPOSITORY_URI" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg previous_image_digest "$PREVIOUS_IMAGE_DIGEST" \
            --arg release_mode "$RELEASE_MODE" \
            --arg expected_legacy_release "$EXPECTED_LEGACY_RELEASE" \
            '{RepositoryUri:[$repository_uri],ImageDigest:[$image_digest],PreviousImageDigest:[$previous_image_digest],ReleaseMode:[$release_mode],ExpectedLegacyRelease:[$expected_legacy_release]}')"
          command_id="$(aws ssm send-command \
            --document-name CoStoryTier3ContainerRelease \
            --targets "Key=InstanceIds,Values=$VALIDATED_TIER3_INSTANCE_ID" \
            --parameters "$parameters" \
            --comment "co-story tier3 ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=false \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$VALIDATED_TIER3_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$VALIDATED_TIER3_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode}' --output json
      - name: Write sanitized delivery metrics
        if: always()
        env:
          REQUESTED_EPOCH: ${{ needs.approval-gate.outputs.requested_epoch }}
          APPROVED_EPOCH: ${{ needs.approval-gate.outputs.approved_epoch }}
          DEPLOY_STARTED_EPOCH: ${{ steps.deploy_timing.outputs.started_epoch }}
          ARTIFACT_READY_EPOCH: ${{ steps.artifact_timing.outputs.artifact_ready_epoch }}
          RELEASE_STARTED_EPOCH: ${{ steps.release_timing.outputs.release_started_epoch }}
        run: >-
          python3 ops/release/write_delivery_metrics.py
          --output outputs/tier3-delivery-metrics.json
          --status "${{ job.status }}"
          --commit-sha "${{ github.sha }}"
          --workflow-run-id "${{ github.run_id }}"
          --request-epoch "$REQUESTED_EPOCH"
          --approval-epoch "$APPROVED_EPOCH"
          --deploy-start-epoch "$DEPLOY_STARTED_EPOCH"
          --artifact-ready-epoch "$ARTIFACT_READY_EPOCH"
          --release-start-epoch "$RELEASE_STARTED_EPOCH"
          --completed-epoch "$(date +%s)"
      - name: Preserve delivery metrics artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tier3-delivery-metrics-${{ github.run_id }}
          path: outputs/tier3-delivery-metrics.json
          if-no-files-found: error
          retention-days: 30
