worker_processes auto;
error_log stderr notice;
pid /run/co-story-nginx-staging/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /run/co-story-nginx-staging/client_temp;
    proxy_temp_path /run/co-story-nginx-staging/proxy_temp;
    fastcgi_temp_path /run/co-story-nginx-staging/fastcgi_temp;
    uwsgi_temp_path /run/co-story-nginx-staging/uwsgi_temp;
    scgi_temp_path /run/co-story-nginx-staging/scgi_temp;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
