user nginx;
worker_processes auto;
error_log stderr notice;
pid /run/co-story-nginx-public/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /run/co-story-nginx-public/client_temp;
    proxy_temp_path /run/co-story-nginx-public/proxy_temp;

    server {
        listen 80 default_server;
        server_name __PUBLIC_IP__;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/co-story/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
